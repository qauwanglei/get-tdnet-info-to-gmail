name: TDnet Monitor

on:
  schedule:
    # cron は UTC 基準。日本時間 8:00-18:00（平日）を3つに分けてカバーする。
    # 1) UTC日曜-木曜 23:00-23:55  = JST月曜-金曜 8:00-8:55（日付が変わる分）
    - cron: "*/5 23 * * 0-4"
    # 2) UTC月曜-金曜 00:00-08:55  = JST月曜-金曜 9:00-17:55
    - cron: "*/5 0-8 * * 1-5"
    # 3) UTC月曜-金曜 09:00        = JST月曜-金曜 18:00（最後の1回）
    - cron: "0 9 * * 1-5"
  workflow_dispatch:  # Actionsタブから手動実行できるように
    inputs:
      date:
        description: "対象日 (YYYYMMDD, JST基準)。空欄なら実行時点のJST日付を自動計算"
        required: false
        default: ""
      ignore_holiday:
        description: "休日/週末判定を無視して強制実行する"
        required: false
        default: false
        type: boolean

# stateファイルをリポジトリにコミットし直すために書き込み権限が必要
permissions:
  contents: write

# 5分おきに走るジョブが重なった場合に、前のrunが終わるまで待たせる
concurrency:
  group: tdnet-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    environment: Development  # ← Secretsが登録されているEnvironment名に合わせて変更
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine target date
        id: target_date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ='Asia/Tokyo' date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TDnet monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TARGET_CODES: ${{ secrets.TARGET_CODES }}
        run: |
          ARGS="--date ${{ steps.target_date.outputs.date }}"
          if [ "${{ github.event.inputs.ignore_holiday }}" = "true" ]; then
            ARGS="$ARGS --ignore-holiday"
          fi
          python3 monitor.py $ARGS

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update tdnet notified state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
